# Server block for the SPA container. Copied to /etc/nginx/conf.d/default.conf,
# so it is included by the base image's nginx.conf — not a full nginx.conf.
#
# Same-origin by design: the SPA calls /api/v1 and nginx proxies /api/ to the
# backend service, so no CORS and no cross-origin cookie handling is needed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; index.html must stay revalidated so a
    # new deploy is picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths render the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE. The upstream name matches the compose service name; under
    # Kubernetes it becomes the Service name — only the orchestration layer changes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE progress streams stall if nginx buffers them.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Ops probes are not exposed publicly; keep them reachable only inside the
    # network. Anything else under /healthz or /readyz returns 404 from nginx.
    location = /healthz {
        return 404;
    }

    location = /readyz {
        return 404;
    }
}
