# Stage 12 单机编排（M0–M3 运行面：仅 PostgreSQL + API + 前端静态产物）。
# 完整说明、环境配置、发布清单与回滚预案见 docs/12_deployment/deployment.md。
#
# 使用前确认仓库根 .env 已按 .env.example 填好，且含 POSTGRES_PASSWORD。
# 启动：docker compose up -d    停止：docker compose down
# 迁移由 migrate 服务一次性执行（alembic upgrade head），不在应用启动时自动跑。
name: huntai-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: huntai
      POSTGRES_USER: huntai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # postgres:18+ 官方镜像把 VOLUME/PGDATA 改到 /var/lib/postgresql（实际数据在
      # 18/docker）。继续挂 /var/lib/postgresql/data 会让入口直接退出、healthcheck 失败。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huntai -d huntai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://huntai:${POSTGRES_PASSWORD:?}@postgres:5432/huntai
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      # environment 优先于 env_file：容器内必须走 compose 网络里的 postgres 主机，
      # 而不是 .env 里给本地裸跑用的 127.0.0.1。
      DATABASE_URL: postgresql+asyncpg://huntai:${POSTGRES_PASSWORD:?}@postgres:5432/huntai
      ARTIFACT_ROOT: /data/artifacts
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # 留空 = 同源 /api/v1（由 nginx 反代到 backend）。
        VITE_API_BASE_URL: ""
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
